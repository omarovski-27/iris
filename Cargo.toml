[workspace]
resolver = "2"
members = ["crates/iris-core", "crates/iris-spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/omarovski-27/iris"

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
clap = { version = "4", features = ["derive"] }

# Release profile for the spike: we care about audio-callback jitter and
# resampler throughput, so optimise and keep debug symbols for profiling.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
