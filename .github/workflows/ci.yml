name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything except the three OS-bound modules is portable, so the real test
  # suite and the latency harness run here — no Windows runner, no microphone,
  # no API key.
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The latency harness is part of CI: it streams the committed WAV fixture
      # through the full engine path at speaking speed and fails if perceived
      # latency regresses past the target.
      - name: latency harness (mock)
        run: cargo run --release --bin iris-harness -- --engine mock --runs 3

      - name: latency harness (modelled cloud)
        run: cargo run --release --bin iris-harness -- --engine mock --runs 3 --simulate 120,160

  # The Windows-only code (WASAPI capture, keyboard hook, SendInput) is
  # type-checked and linted by cross-compiling. It is not *run*: see below.
  windows-cross:
    name: cross-compile (windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --release --workspace --target x86_64-pc-windows-gnu

# Deliberately not in CI: text injection.
#
# Windows delivers synthetic keystrokes only on the desktop the user is looking
# at — SendInput returns ERROR_ACCESS_DENIED anywhere else — so an automated
# injection test would type into whatever session the runner is presenting.
# `iris-spike --self-test` skips injection by default for the same reason.
# Injection is verified by the interactive checklist in
# crates/iris-spike/README.md. Please do not add it here.
