[package]
name = "iris-app"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
publish = false
description = "Iris: the resident push-to-talk dictation app — hotkey, streaming transcription, polish, injection, tray."
readme = "README.md"

# The product is `iris`, not `iris-app`; the crate is only named for the
# directory it lives in.
[[bin]]
name = "iris"
path = "src/main.rs"

[build-dependencies]
# Embeds the icon and version metadata (build.rs). Drives the mingw `windres`
# already required to link this target — see build.rs's module doc.
winresource = "0.1"

[features]
default = []
# Real offline ASR. Off by default because the native engines (sherpa-onnx,
# whisper.cpp) do not cross-compile to x86_64-pc-windows-gnu from WSL; see
# crates/iris-engine-local/README.md. Build them on native Windows.
local-native = ["iris-engine-local/native"]

[dependencies]
iris-core = { path = "../iris-core" }
iris-polish = { path = "../iris-polish" }
iris-engine-local = { path = "../iris-engine-local" }
iris-overlay = { path = "../iris-overlay" }

anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml = "0.9"
# Stamps session-log entries with a wall-clock RFC 3339 timestamp (`Instant`
# is monotonic and cannot be written to a file), and reads them back in the
# settings window to show them in local time. Deliberately no `local-offset`
# feature: that lookup is unsound in a multi-threaded process, which is why
# the offset comes from `GetTimeZoneInformation` in `window::shell` instead.
time = { version = "0.3", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
] }
# The settings window's view layer (crate::window::ui and friends) is built on
# plain egui — no windowing, no GL — so it type-checks and can be exercised
# headlessly on every platform. Only `eframe` (the native window/GL backend)
# is Windows-only; see crate::window's docs.
egui = "0.32"

[target.'cfg(windows)'.dependencies]
# Tray: `tray-icon` is the maintained extraction of Tauri's tray implementation
# (same authors as `muda`, which it uses for the menu). It is pure Rust over
# Win32 — no C toolchain — so it cross-compiles to x86_64-pc-windows-gnu, which
# is how this project builds. See README.md for the alternatives considered.
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # A named mutex + event pair so a second launch can wake the first
    # instance's window instead of starting a second resident process. See
    # `single_instance`.
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # GetTimeZoneInformation: the settings window's "Dictations today" needs
    # the local calendar day, and `time`'s own local-offset lookup is unsound
    # in a multi-threaded process. See `window::shell`.
    "Win32_System_Time",
] }
# Settings window: immediate-mode, pure Rust over WGL (the `glow` backend) —
# no MSVC, no WebView2 runtime to bundle. Proved to cross-compile+link on
# x86_64-pc-windows-gnu with nothing beyond the mingw linker already required
# for this target; see crate::window's module docs for the alternatives
# considered (wry/tao also cross-compiles, but needs the WebView2 runtime and
# a loader DLL alongside iris.exe, and would put HTML/CSS in an all-Rust repo).
eframe = "0.32"
# Only for `EventLoopBuilderExtWindows::with_any_thread` in `window::shell`:
# winit refuses to create an event loop off the main thread by default (a
# cross-platform footgun guard), but the settings window — like the tray and
# the overlay — has to live on its own thread. Version pinned to what eframe
# 0.32 itself depends on so the `EventLoopBuilder` types match.
winit = { version = "0.30", default-features = false }

[dev-dependencies]
tempfile = "3"
