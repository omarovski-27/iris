[package]
name = "iris-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core pipeline for Iris: audio normalisation, streaming transcription engines, text injection, latency instrumentation."

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
percent-encoding.workspace = true

tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
    "macros",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "multipart",
    "http2",
    "charset",
] }
# Pin the crypto provider explicitly: `ring` is pure-Rust-plus-asm and
# cross-compiles to x86_64-pc-windows-gnu with the mingw toolchain, whereas the
# default `aws-lc-rs` wants cmake + nasm on the host. See docs/dev-windows.md.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Same version tokio-tungstenite's own `rustls-tls-webpki-roots` feature pins
# (see its Cargo.toml): building our own `ClientConfig` from the identical
# root store, once, is what lets `engine/net.rs` share it across connections
# for TLS session resumption instead of every dictation paying a fresh
# handshake — see that module's doc comment.
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
cpal = "0.17"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
